[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mimesys"
version = "0.1.0"
description = "Diffusion-based system emulation framework"
authors = [
    { name = "Donghyun Kim", email = "donghyun@utexas.edu" },
    { name = "Zichao Hu",    email = "zichao@utexas.edu" },
]
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch==2.5.1",
    "pytorch-lightning==2.3.3",
    "setuptools<80",             # pkg_resources removed in setuptools 80+; needed by pytorch-lightning 2.3.x
    "einops==0.8.0",
    "numpy==1.26.4",
    # Config
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    # Logging
    "wandb==0.19.0",
    # Data / preprocessing
    "h5py==3.14.0",
    "pandas==2.0.3",
    "polars==1.17.1",
    "scipy==1.14.1",
    "scikit-learn==1.6.1",
    "fastdtw==0.3.4",
    # Visualization
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    # Remote execution / collection
    "paramiko==3.5.1",
    "pydantic==2.10.3",
    "tqdm==4.67.1",
    # Server
    "fastapi",
    "uvicorn",
    "requests",
]

[tool.setuptools.packages.find]
include = ["mimesys*"]
