# @package _global_
# Strategy 3: KL-regularized RL
# - KL divergence penalty keeps model close to pretrained distribution
# - kl_coef=0.05 to prevent catastrophic forgetting
# - Uniform reward (io_reward_weight=1.0)
# - Low learning rate (3e-7)
# - High-IO biased data sampling retained

data:
  data_path: /home/dhkim/mimesys_training_data/surrogate_v2
  action_path: /home/dhkim/mimesys_training_data/surrogate_v2
  test_data_path: "/home/dhkim/tacc_stats_results/benchmarks/workload_mix_long/traces/benchmarks"
  clip_ckpt_path: "/home/dhkim/workspace/stress_emulate/llm-app-generation/mimesys/stress_ng_dataloader/train/clip/mimesys_clip/diffusion-epoch=1999-train_loss=5.44998.ckpt"
  transformer_ckpt_path: "/home/dhkim/workspace/stress_emulate/llm-app-generation/mimesys/stress_ng_dataloader/train/clip/mimesys_trace_predictor/diffusion-epoch=1999.ckpt"
  test_machines:
  - c220g2-011110.wisc.cloudlab.us
  - c220g2-030631.wisc.cloudlab.us
  - c220g2-011327.wisc.cloudlab.us
  - c220g2-010832.wisc.cloudlab.us
  - c220g2-011009.wisc.cloudlab.us
  - c220g2-011332.wisc.cloudlab.us
  - c220g2-011101.wisc.cloudlab.us
  - c220g2-010820.wisc.cloudlab.us
  - c220g2-010632.wisc.cloudlab.us
  - c220g2-011027.wisc.cloudlab.us
  - c220g2-010607.wisc.cloudlab.us
  - c220g2-011013.wisc.cloudlab.us
  - c220g2-011324.wisc.cloudlab.us
  - c220g2-011025.wisc.cloudlab.us
  batch_size: 1
  test_batch_size: 1
  dataset_size: 100
  aug_factor: 5
  intra_only_aug: true
  high_io_aug_factor: 10
  io_raw_threshold: 1000.0

profiler:
  user_name: dhkim
  private_key_path: /home/dhkim/.ssh/id_rsa_utns
  my_hostname: mew3
  destination_path: /home/dhkim/tacc_stats_results
  validation_destination_path: /home/dhkim/fleetbench_tacc_stats_validation_results

train:
  callbacks:
    checkpoint:
      dirpath: diffusion/fleetbench_stress_ng_rl_v3
      every_n_epochs: 10
      monitor: epoch
      save_last: true
  trainer:
    trainer_model_name: MimesysTrainer
    check_val_every_n_epoch: 10
    devices: 1
    max_epochs: 10000
    ckpt_path: "/home/dhkim/workspace/stress_emulate/llm-app-generation/mimesys/training/diffusion/fleetbench_stress_ng/diffusion-epoch=999-v2.ckpt"
  optim:
    lr: 3e-7
  run_train: true
  run_test: false
  use_rl: true
  prev_state_lambda: 0.0
  ddpo:
    num_inner_epochs: 1
    num_batches_per_episode: 14
    reward_type: "profiling"
    io_reward_weight: 1.0
    kl_coef: 0.05
  async_validation: false

model:
  unet:
    input_dim: 20
  mlp:
    input_dim: 480
    hidden_dim: 128
    dropout: 0.1
  context:
    input_dim: 25
    action_dim: 33
    num_heads: 4
    num_layers: 6
    hidden_dim: 256
    dropout: 0.1
  clip:
    modality1_input_dim: 22
    modality2_input_dim: 500
    modality1: transformer
    modality2: transformer
    embed_dim: 256
  transformer:
    input_dim: 500
    output_dim: 25
    num_heads: 4
    num_layers: 6
    hidden_dim: 256
    dropout: 0.1
  diffusion:
    n_timesteps: 25
    cfg_args:
      cfg_drop_prob: 0.1
      cfg_guide_w: 3
  autoencoder:
    input_dim: 25
    hidden_dim: 16
    latent_dim: 10
  action_delta_predictor:
    input_dim: 22
    hidden_dim: 32
    channel_dim: 20
    horizon_dim: 10

log:
  project_name: mimesys_socket
  run_name: diffusion/fleetbench_stress_ng_rl_v3
