# @package _global_
data:
  data_path: /home/dhkim/mimesys_training_data/v1
  action_path: /home/dhkim/mimesys_training_data/v1
  test_data_path: /home/dhkim/mimesys/artifacts/traces
  test_machines:
  - c220g2-011110.wisc.cloudlab.us
  batch_size: 1
  test_batch_size: 1
  dataset_size: 100
  aug_factor: 10
  intra_only_aug: true
  high_io_aug_factor: 1
  io_raw_threshold: 1000.0
log:
  project_name: mimesys_rl
  run_name: diffusion/mimesys_finetune_rl_v1
profiler:
  user_name: dhkim
  private_key_path: /home/dhkim/.ssh/id_rsa
  my_hostname: <FILL_IN_HOSTNAME>
  destination_path: /home/dhkim/mimesys_profiling_results
  validation_destination_path: /home/dhkim/mimesys_validation_results

train:
  callbacks:
    checkpoint:
      dirpath: diffusion/mimesys_finetune_rl_v1
      every_n_epochs: 10
      monitor: epoch
      save_last: true
  trainer:
    trainer_model_name: MimesysTrainer
    check_val_every_n_epoch: 10
    devices: 1
    max_epochs: 10000
    ckpt_path: <FILL_IN_CKPT_PATH>
  optim:
    lr: 3e-6
  run_train: true
  run_test: false
  use_rl: true
  prev_state_lambda: 0.0
  ddpo:
    num_inner_epochs: 1
    num_batches_per_episode: 14
    reward_type: "profiling"
    io_reward_weight: 1.0
    kl_coef: 0.05
  async_validation: false

model:
  unet:
    input_dim: 20
  mlp:
    input_dim: 480
    hidden_dim: 128
    dropout: 0.1
  context:
    input_dim: 23
    action_dim: 33
    num_heads: 4
    num_layers: 6
    hidden_dim: 256
    dropout: 0.1
  transformer:
    input_dim: 500
    output_dim: 23
    num_heads: 4
    num_layers: 6
    hidden_dim: 256
    dropout: 0.1
  diffusion:
    n_timesteps: 25
    cfg_args:
      cfg_drop_prob: 0.1
      cfg_guide_w: 3
  autoencoder:
    input_dim: 23
    hidden_dim: 16
    latent_dim: 10
